<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Key & Gọi Aesop Carl</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body {
      background: radial-gradient(circle at center, #1b2028 0%, #0d1016 100%);
      color: #e0e6ed;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .container {
      background: rgba(22, 27, 34, 0.85);
      border: 1px solid rgba(138, 155, 175, 0.25);
      border-radius: 24px;
      padding: 30px;
      width: 440px;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0,0,0,0.7);
      backdrop-filter: blur(16px);
    }
    .avatar { font-size: 55px; margin-bottom: 10px; }
    h1 { font-size: 20px; margin-bottom: 5px; color: #f0f4f8; }
    p.sub { font-size: 13px; color: #8c9ba9; margin-bottom: 20px; }
    
    .test-box {
      background: rgba(0, 0, 0, 0.35);
      border: 1px dashed #485b73;
      border-radius: 14px;
      padding: 15px;
      margin-bottom: 20px;
      text-align: left;
    }
    .test-box p { font-size: 12px; color: #a0aec0; margin-bottom: 8px; }
    .key-preview { font-family: monospace; font-size: 11px; color: #64b5f6; word-break: break-all; margin-bottom: 12px; }
    
    .btn {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: 0.2s;
    }
    .btn-test { background: #3b82f6; color: white; margin-bottom: 8px; }
    .btn-test:hover { background: #2563eb; }
    
    .btn-call { background: #10b981; color: white; margin-top: 10px; }
    .btn-call:hover { background: #059669; }
    .btn-end { background: #ef4444; color: white; display: none; margin-top: 10px; }
    
    #resultBox {
      display: none;
      margin-top: 10px;
      padding: 12px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.5;
      word-break: break-word;
    }
    .success { background: rgba(16, 185, 129, 0.15); border: 1px solid #10b981; color: #6ee7b7; }
    .error { background: rgba(239, 68, 68, 0.15); border: 1px solid #ef4444; color: #fca5a5; }

    .status-badge {
      font-size: 12px;
      color: #9cb1c9;
      margin-top: 15px;
      display: block;
    }
    .model-tag {
      display: inline-block;
      background: rgba(255, 255, 255, 0.1);
      padding: 2px 6px;
      border-radius: 4px;
      font-family: monospace;
      font-size: 11px;
      margin: 2px;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="avatar">🥀</div>
    <h1>Aesop Carl • Identity V</h1>
    <p class="sub">Kiểm tra & Kết nối trực tiếp với Google Gemini</p>

    <!-- KHU VỰC BẤM TEST -->
    <div class="test-box">
      <p>🔑 <b>Khóa API của bạn:</b></p>
      <div class="key-preview" id="keyDisplay"></div>
      
      <button class="btn btn-test" id="btnTest" onclick="autoDetectAndTest()">
        <span>⚡ Bấm vào để kiểm tra tự động</span>
      </button>

      <div id="resultBox"></div>
    </div>

    <!-- KHU VỰC GỌI CHO AESOP -->
    <button class="btn btn-call" id="btnCall" onclick="startCall()">
      <span>📞 Nhấc máy gọi Aesop Carl</span>
    </button>
    <button class="btn btn-end" id="btnEnd" onclick="endCall()">
      <span>📴 Gác máy</span>
    </button>

    <span class="status-badge" id="statusBadge">Trạng thái: Sẵn sàng</span>
  </div>

  <script>
    const API_KEY = "AQ.Ab8RN6JLZ7vHymdgt3fZktB5HplSWUdHE1ggisT0pCOfgzjlqg";
    document.getElementById('keyDisplay').innerText = API_KEY;

    let selectedModel = "models/gemini-2.0-flash-exp";

    // 1. TỰ ĐỘNG DÒ TÌM MODEL VÀ TEST
    async function autoDetectAndTest() {
      const btn = document.getElementById('btnTest');
      const resBox = document.getElementById('resultBox');
      
      btn.innerText = "⏳ Đang kết nối và lấy danh sách model...";
      btn.disabled = true;
      resBox.style.display = 'none';

      try {
        // Bước 1: Gọi ListModels để lấy các model mà tài khoản bạn được cấp phép
        const listUrl = `https://generativelanguage.googleapis.com/v1beta/models?key=${API_KEY}`;
        const listRes = await fetch(listUrl);
        const listData = await listRes.json();

        if (!listRes.ok) {
          throw new Error(listData.error?.message || "Lỗi xác thực với Google");
        }

        const availableModels = (listData.models || [])
          .filter(m => m.supportedGenerationMethods && m.supportedGenerationMethods.includes("generateContent"))
          .map(m => m.name);

        if (availableModels.length === 0) {
          throw new Error("Tài khoản của bạn chưa kích hoạt model nào.");
        }

        // Chọn model phù hợp nhất
        let testModel = availableModels.find(m => m.includes("2.0-flash")) || 
                        availableModels.find(m => m.includes("flash")) || 
                        availableModels[0];

        selectedModel = testModel; // Lưu lại để dùng cho cuộc gọi thoại

        btn.innerText = "⏳ Đang thử gửi tin nhắn đến " + testModel.replace("models/", "") + "...";

        // Bước 2: Gửi câu chào thử nghiệm
        const chatUrl = `https://generativelanguage.googleapis.com/v1beta/${testModel}:generateContent?key=${API_KEY}`;
        const chatRes = await fetch(chatUrl, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            contents: [{ parts: [{ text: "Hãy nói một câu ngắn: 'Khóa API hoạt động rất tốt, chào bạn!' bằng tiếng Việt." }] }]
          })
        });

        const chatData = await chatRes.json();
        const reply = chatData.candidates?.[0]?.content?.parts?.[0]?.text || "Kết nối thành công!";

        resBox.className = "success";
        resBox.innerHTML = `
          <b>✅ XÁC THỰC THÀNH CÔNG 100%!</b><br>
          Model đang dùng: <b>${testModel}</b><br>
          AI phản hồi: <i>"${reply.trim()}"</i><br><br>
          <small>✨ Các model khả dụng trong tài khoản của bạn:<br>
          ${availableModels.slice(0, 4).map(m => `<span class="model-tag">${m.replace('models/', '')}</span>`).join('')}
          </small>
        `;

      } catch (err) {
        resBox.className = "error";
        resBox.innerHTML = `<b>❌ Lỗi:</b> ${err.message}`;
      } finally {
        resBox.style.display = 'block';
        btn.innerText = "⚡ Bấm để kiểm tra lại";
        btn.disabled = false;
      }
    }

    // 2. CUỘC GỌI THOẠI TRỰC TIẾP
    let ws = null, audioCtxIn = null, audioCtxOut = null, micStream = null, scriptProcessor = null, nextPlayTime = 0, audioSources = [], isSetupComplete = false;

    async function startCall() {
      updateStatus("Đang mở Micro...");
      try {
        micStream = await navigator.mediaDevices.getUserMedia({ audio: { channelCount: 1, sampleRate: 16000 } });
      } catch (err) {
        alert("Lỗi Micro: " + err.message + "\n(Vui lòng mở web qua localhost hoặc Live Server để có quyền Micro!)");
        updateStatus("Lỗi cấp quyền Micro");
        return;
      }

      updateStatus("Đang gọi tới Aesop...");
      const url = `wss://generativelanguage.googleapis.com/ws/google.ai.generativelanguage.v1alpha.GenerativeService.BidiGenerateContent?key=${API_KEY}`;
      ws = new WebSocket(url);

      ws.onopen = () => {
        updateStatus("Đang thiết lập đường truyền...");
        ws.send(JSON.stringify({
          setup: {
            model: "models/gemini-2.0-flash-exp",
            generationConfig: { 
              responseModalities: ["AUDIO"], 
              speechConfig: { voiceConfig: { prebuiltVoiceConfig: { voiceName: "Fenrir" } } } 
            },
            systemInstruction: { parts: [{ text: "Bạn là Aesop Carl trong Identity V (chuyên viên khâm liệm 21 tuổi). Bạn mắc chứng sợ xã hội, tính cách trầm buồn, ít nói, ngập ngừng, xưng tôi - gọi cậu. Nói tiếng Việt ngắn gọn 1-2 câu." }] }
          }
        }));
      };

      ws.onmessage = async (e) => {
        const msg = JSON.parse(e.data instanceof Blob ? await e.data.text() : e.data);
        if (msg.setupComplete) {
          isSetupComplete = true;
          updateStatus("Aesop đang nhấc máy...");
          ws.send(JSON.stringify({
            clientContent: { 
              turns: [{ role: "user", parts: [{ text: "[Chuông điện thoại đổ 2 hồi, cậu ngập ngừng nhấc máy lên nghe]" }] }], 
              turnComplete: true 
            }
          }));
          startMic();
        }
        if (msg.serverContent?.modelTurn?.parts) {
          for (const p of msg.serverContent.modelTurn.parts) {
            if (p.inlineData?.data) {
              updateStatus("Aesop đang nói...");
              playAudio(p.inlineData.data);
            }
          }
        }
        if (msg.serverContent?.turnComplete) setTimeout(() => updateStatus("Đang lắng nghe bạn..."), 300);
      };

      ws.onerror = () => updateStatus("Lỗi WebSocket!");
      ws.onclose = () => { endCall(); updateStatus("Đã kết thúc cuộc gọi"); };

      document.getElementById('btnCall').style.display = 'none';
      document.getElementById('btnEnd').style.display = 'flex';
    }

    function startMic() {
      audioCtxIn = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 16000 });
      audioCtxOut = new (window.AudioContext || window.webkitAudioContext)({ sampleRate: 24000 });
      if (audioCtxOut.state === 'suspended') audioCtxOut.resume();
      nextPlayTime = audioCtxOut.currentTime;

      const source = audioCtxIn.createMediaStreamSource(micStream);
      scriptProcessor = audioCtxIn.createScriptProcessor(2048, 1, 1);
      scriptProcessor.onaudioprocess = (e) => {
        if (!ws || ws.readyState !== WebSocket.OPEN || !isSetupComplete) return;
        const input = e.inputBuffer.getChannelData(0);
        const pcm16 = new Int16Array(input.length);
        for (let i = 0; i < input.length; i++) {
          const s = Math.max(-1, Math.min(1, input[i]));
          pcm16[i] = s < 0 ? s * 0x8000 : s * 0x7fff;
        }
        let bin = "";
        const u8 = new Uint8Array(pcm16.buffer);
        for (let i = 0; i < u8.length; i++) bin += String.fromCharCode(u8[i]);
        ws.send(JSON.stringify({ realtimeInput: { mediaChunks: [{ mimeType: "audio/pcm;rate=16000", data: btoa(bin) }] } }));
      };
      source.connect(scriptProcessor);
      scriptProcessor.connect(audioCtxIn.destination);
    }

    function playAudio(base64) {
      const bin = atob(base64);
      const u8 = new Uint8Array(bin.length);
      for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i);
      const dv = new DataView(u8.buffer);
      const f32 = new Float32Array(Math.floor(u8.length / 2));
      for (let i = 0; i < f32.length; i++) f32[i] = dv.getInt16(i * 2, true) / 32768.0;

      const buf = audioCtxOut.createBuffer(1, f32.length, 24000);
      buf.getChannelData(0).set(f32);
      const node = audioCtxOut.createBufferSource();
      node.buffer = buf;
      node.connect(audioCtxOut.destination);
      const start = Math.max(audioCtxOut.currentTime, nextPlayTime);
      node.start(start);
      nextPlayTime = start + buf.duration;
      audioSources.push(node);
    }

    function updateStatus(t) { document.getElementById('statusBadge').innerText = "Trạng thái: " + t; }

    function endCall() {
      isSetupComplete = false;
      if (ws) ws.close();
      if (micStream) micStream.getTracks().forEach(t => t.stop());
      if (scriptProcessor) scriptProcessor.disconnect();
      if (audioCtxIn) audioCtxIn.close();
      if (audioCtxOut) audioCtxOut.close();
      for (const s of audioSources) { try { s.stop(); } catch(e){} }
      audioSources = [];
      document.getElementById('btnCall').style.display = 'flex';
      document.getElementById('btnEnd').style.display = 'none';
    }
  </script>
</body>
</html>
